name: Compilar APK de Flutter

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Descargar dependencias
        run: flutter pub get

      - name: Compilar APK en modo debug
        run: flutter build apk --debug

      - name: Subir el APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: cancionero-apk-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
